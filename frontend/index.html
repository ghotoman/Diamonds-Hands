<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Diamond Hands · Base App</title>
    <meta name="description" content="Lock your ERC-20 on-chain and beat paper hands." />
    <meta name="theme-color" content="#0000FF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Diamond Hands" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    <!--
      Base App / Farcaster Mini App embed. __APP_URL__ is filled at build time
      from VITE_APP_URL (or the host's URL on Vercel / Netlify) — see vite.config.ts.
    -->
    <meta
      name="fc:miniapp"
      content='{"version":"1","imageUrl":"__APP_URL__/og.png","button":{"title":"Open Diamond Hands","action":{"type":"launch_miniapp","name":"Diamond Hands","url":"__APP_URL__"}}}'
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
