name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Ежедневный полный прогон invariant-сьюта (только на default-ветке —
  # таково поведение schedule в GitHub Actions).
  schedule:
    - cron: "0 6 * * *" # каждый день в 06:00 UTC
  # Ручной запуск из вкладки Actions — гоняет ОБА job'а (полная проверка).
  workflow_dispatch:

# Отменяем устаревшие прогоны на той же ветке/PR, чтобы не жечь раннеры.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Профиль ci из foundry.toml: 1000 fuzz-runs, verbosity 4.
  FOUNDRY_PROFILE: ci

jobs:
  # Быстрый гейт на каждый push/PR: fmt + build + 104 unit-теста (~1 мин).
  # Invariant-сьют исключён, чтобы не растягивать push до ~8 минут.
  unit:
    name: Unit (fmt, build, unit tests)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        # Foundry-проект живёт в contracts/, корень репо — монорепо.
        working-directory: contracts
    steps:
      - name: Checkout (с submodules — зависимости forge-std и OZ)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # nightly вместо stable: у stable-релиза v1.7.1 ломается
          # пост-проверка аттестаций бинарников в foundryup
          # ("no expected hash for forge"). nightly обходит этот путь;
          # solc всё равно зафиксирован 0.8.24 в foundry.toml.
          version: nightly

      - name: Forge version
        run: forge --version

      - name: Check formatting (forge fmt --check)
        run: forge fmt --check

      - name: Build (с проверкой размеров байткода)
        run: forge build --sizes

      - name: Unit tests (без invariant-сьюта)
        run: forge test --no-match-path 'test/Invariants.t.sol' -vvv

  # Фронт: typecheck (tsc) + сборка (vite) на каждый push/PR.
  frontend:
    name: Frontend (typecheck, build)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (tsc -b + vite build)
        run: npm run build

  # TVL-монитор (off-chain guardrail): typecheck + unit-тесты чистой
  # TVL-математики. Сетевые вызовы здесь не гоняются (нужен Base RPC).
  monitoring:
    name: Monitoring (typecheck, test)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: monitoring/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests (TVL math)
        run: npm test

  # Тяжёлый invariant-сьют (~7 мин): по расписанию (ежедневно на main)
  # и по ручному запросу. НЕ блокирует обычные push/PR.
  invariant:
    name: Invariant suite
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout (с submodules — зависимости forge-std и OZ)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Forge version
        run: forge --version

      - name: Invariant tests
        run: forge test --match-path 'test/Invariants.t.sol' -vvv
