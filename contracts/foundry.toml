[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fuzz]
runs = 256

# Don't run the Solidity linter during `forge build`. The nightly forge
# linter (used in CI) panics on our code (reentrancy-events lint, a known
# upstream bug). Lint warnings (e.g. block.timestamp) are noise here anyway;
# CI quality is covered by forge fmt + tests + invariants + the security review.
[lint]
lint_on_build = false

[profile.ci]
fuzz = { runs = 1000 }
verbosity = 4

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
base_mainnet = "${BASE_MAINNET_RPC_URL}"

# Etherscan V2 — единый мультичейн-API. НЕ указываем url: forge сам
# строит V2-эндпоинт и добавляет обязательный ?chainid= из поля chain.
# (Явный url ломал запрос: "Missing chainid parameter" — forge добавляет
# chainid только на built-in пути, не для пользовательского url.)
# Один ключ Etherscan (etherscan.io) работает на всех сетях, вкл. Base.
[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
base_mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 8453 }
