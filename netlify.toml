# Netlify build config for the Diamond Hands frontend (monorepo subdir).
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA fallback. Static files (incl. /.well-known/farcaster.json) are served
# first; this only catches unknown paths so the app loads at any URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Let the Coinbase Smart Wallet popup (keys.coinbase.com) reach window.opener.
# `same-origin` would null it → "this app does not support smart wallets".
# COEP is intentionally left unset (not required, and can break embeds).
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"

